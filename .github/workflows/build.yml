name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  matrix:
    name: Load matrix
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.load.outputs.test_matrix }}
      build_matrix: ${{ steps.load.outputs.build_matrix }}
      versions: ${{ steps.load.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - id: load
        run: |
          {
            echo "test_matrix=$(jq -c . versions.json)"
            echo "build_matrix=$(jq -c '[
              .[] | . as $v |
              ($v.platforms | split(",")) as $ps |
              $ps[] | . as $p | {
                version: $v.version,
                platform: $p,
                platform_slug: ($p | gsub("/"; "-")),
                runner: (if $p == "linux/arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)
              }
            ]' versions.json)"
            echo "versions=$(jq -c '[.[].version]' versions.json)"
          } >> "$GITHUB_OUTPUT"

  test:
    name: PHP ${{ matrix.version }} test
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v6

      # Tests run single-arch on amd64; the docker driver lets the debug
      # image's `FROM graze/php-alpine:VER` resolve from the local daemon.
      - name: Build (single-arch for tests)
        run: make build-${{ matrix.version }} platform=--platform=linux/amd64

      - name: Tag
        run: make tag-${{ matrix.version }}

      - name: Test
        run: make test-${{ matrix.version }}

  build:
    name: PHP ${{ matrix.version }} (${{ matrix.platform }})
    needs: [matrix, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        env:
          V: ${{ matrix.version }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ matrix.platform_slug }}
        run: |
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          VCS_REF="$(git rev-parse --short HEAD)"
          mkdir -p /tmp/digests/main /tmp/digests/test

          docker buildx build \
            --platform="$PLATFORM" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VCS_REF="$VCS_REF" \
            --cache-from="type=registry,ref=graze/php-alpine:buildcache-${V}-${SLUG}" \
            --cache-to="type=registry,ref=graze/php-alpine:buildcache-${V}-${SLUG},mode=max" \
            --output="type=image,name=graze/php-alpine,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file=/tmp/main-metadata.json \
            "./$V"

          docker buildx build \
            --platform="$PLATFORM" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg VCS_REF="$VCS_REF" \
            -f "./$V/debug.Dockerfile" \
            --cache-from="type=registry,ref=graze/php-alpine:buildcache-${V}-test-${SLUG}" \
            --cache-to="type=registry,ref=graze/php-alpine:buildcache-${V}-test-${SLUG},mode=max" \
            --output="type=image,name=graze/php-alpine,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file=/tmp/test-metadata.json \
            "./$V"

          main_digest=$(jq -r '."containerimage.digest"' /tmp/main-metadata.json)
          test_digest=$(jq -r '."containerimage.digest"' /tmp/test-metadata.json)
          touch "/tmp/digests/main/${main_digest#sha256:}"
          touch "/tmp/digests/test/${test_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.version }}-${{ matrix.platform_slug }}
          path: /tmp/digests
          retention-days: 1

  manifest:
    name: PHP ${{ matrix.version }} manifest
    needs: [matrix, build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.version }}-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          V: ${{ matrix.version }}
        run: |
          main_tags="-t graze/php-alpine:${V}"
          test_tags="-t graze/php-alpine:${V}-test"
          case "$V" in
            5.6)
              main_tags="$main_tags -t graze/php-alpine:5"
              test_tags="$test_tags -t graze/php-alpine:5-test"
              ;;
            7.4)
              main_tags="$main_tags -t graze/php-alpine:7"
              test_tags="$test_tags -t graze/php-alpine:7-test"
              ;;
            8.5)
              main_tags="$main_tags -t graze/php-alpine:8 -t graze/php-alpine:latest"
              test_tags="$test_tags -t graze/php-alpine:8-test -t graze/php-alpine:test"
              ;;
          esac

          main_sources=$(find /tmp/digests -path '*/main/*' -type f -printf 'graze/php-alpine@sha256:%f ')
          test_sources=$(find /tmp/digests -path '*/test/*' -type f -printf 'graze/php-alpine@sha256:%f ')

          if [ -z "$main_sources" ] || [ -z "$test_sources" ]; then
            echo "Missing digests for ${V}" >&2
            exit 1
          fi

          docker buildx imagetools create $main_tags $main_sources
          docker buildx imagetools create $test_tags $test_sources
